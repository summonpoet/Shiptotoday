[package]
name = "dingding-zones"
version = "0.1.0"
description = "DingDing Zones Windows desktop MVP"
authors = ["DingDing Zones"]
edition = "2021"

[lib]
name = "dingding_zones_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
