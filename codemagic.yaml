workflows:
  ios-simulator:
    name: Ship to Today · iOS simulator validation
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci
      - name: Sync shared web app into Capacitor iOS
        script: npm run ios:sync
      - name: Compile unsigned iOS simulator app
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app

  ios-testflight:
    name: Ship to Today · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: ship-to-today-testflight
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.summonpoet.shiptotoday
      vars:
        APP_STORE_APPLE_ID: 6796910635
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: latest
      xcode: latest
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci
      - name: Sync shared web app into Capacitor iOS
        script: npm run ios:sync
      - name: Apply App Store signing profile
        script: >-
          xcode-project use-profiles
          --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Set TestFlight build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
